// Export dashboard pages
Object.assign(window, {
  CustomerDashboard, AdminDashboard, BookingManagement, RoomManagement, StaffManagement, StaffVerification, LiveRoomManagement, EnergyUsageOverview,
  CheckInOut, UserManagement, PaymentPage, EnquiryManagement, AdminLayout,
});

</script>
<script type="text/babel">

// ─── MAIN APP — ROUTER + TWEAKS ───────────────────────────────────────────────

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#C9A96E",
  "fontStyle": "serif",
  "navTransparent": true,
  "darkSidebar": true
}/*EDITMODE-END*/;

const App = () => {
  // Always start on the public home page when the website is opened.
  // Login is selected from the Sign In page, then the user is routed by role.
  const [session, setSession] = React.useState(null);
  const userRole = session?.user.role || '';
  const [page, setPage] = React.useState('home');
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  React.useEffect(() => {
    // A new site opening always starts from the public Home page.
    // Role access is selected again from Sign In, while in-page role navigation stays active until Logout.
    try { ['ga_role', 'gdr_token', 'gdr_user'].forEach(key => localStorage.removeItem(key)); localStorage.setItem('ga_page', 'home'); } catch(e) {}
  }, []);

  React.useEffect(() => {
    try { localStorage.setItem('ga_page', page); } catch(e) {}
    window.scrollTo(0, 0);
  }, [page]);

  const publicPages = ['home', 'rooms', 'roomdetail', 'contact'];
  const customerPages = ['rooms', 'roomdetail', 'booking', 'contact', 'customerdash'];
  const staffPages = ['staffverify', 'checkinout', 'bookingmgmt', 'enquiry'];
  const adminPages = ['admin', 'bookingmgmt', 'checkinout', 'staffverify', 'roommgmt', 'liveroommgmt', 'energyusage', 'staffmgmt', 'usermgmt', 'payment', 'enquiry'];
  const rolePages = userRole === 'admin' ? adminPages : userRole === 'staff' ? staffPages : userRole === 'customer' ? customerPages : [...publicPages, 'auth'];
  const landingPage = userRole === 'admin' ? 'admin' : userRole === 'staff' ? 'staffverify' : userRole === 'customer' ? 'customerdash' : 'home';

  React.useEffect(() => {
    if (!userRole) {
      if (page === 'booking') setPage('auth');
      else if (!rolePages.includes(page)) setPage('home');
    } else if (!rolePages.includes(page)) {
      setPage(landingPage);
    }
  }, [userRole, page]);

  const logout = () => {
    if (session) fetch(AUTH_API + '/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + session.token } }).catch(() => {});
    setSession(null);
    setPage('auth');
  };

  React.useEffect(() => {
    if (!session) return;
    let active = true;
    const controller = new AbortController();
    const verify = async () => {
      try {
        const response = await fetch(AUTH_API + '/me', { headers: { Authorization: 'Bearer ' + session.token }, signal: controller.signal });
        const data = await response.json();
        if (active && (response.status === 401 || response.status === 403 || (response.ok && data.user?.role !== session.user.role))) {
          setSession(null); setPage('auth');
        }
      } catch (_) { /* A temporary network failure does not grant additional access. */ }
    };
    const expiry = JSON.parse(atob(session.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000;
    const expire = setTimeout(() => { setSession(null); setPage('auth'); }, Math.min(Math.max(0, expiry - Date.now()), 2147483647));
    const timer = setInterval(verify, 60000);
    window.addEventListener('focus', verify);
    return () => { active = false; controller.abort(); clearTimeout(expire); clearInterval(timer); window.removeEventListener('focus', verify); };
  }, [session]);

  // Tweaks panel communication
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  // Public pages with nav
  const isPublic = publicPages.includes(page);
  const isAuth = page === 'auth';
  const isCustomerDash = page === 'customerdash';
  const isAdmin = ['admin', 'bookingmgmt', 'roommgmt', 'liveroommgmt', 'energyusage', 'staffmgmt', 'staffverify', 'checkinout', 'usermgmt', 'payment', 'enquiry'].includes(page);

  const renderPage = () => {
    if (!rolePages.includes(page)) return null;
    switch(page) {
      case 'home':       return <HomePage setPage={setPage} />;
      case 'rooms':      return <RoomsPage setPage={setPage} />;
      case 'roomdetail': return <RoomDetailPage setPage={setPage} />;
      case 'booking':    return <BookingPage setPage={setPage} />;
      case 'contact':    return <ContactPage setPage={setPage} />;
      case 'auth':       return <AuthPage setPage={setPage} setSession={setSession} />;
      case 'customerdash': return <CustomerDashboard setPage={setPage} />;
      case 'admin':      return <AdminDashboard setPage={setPage} />;
      case 'bookingmgmt': return <BookingManagement setPage={setPage} />;
      case 'roommgmt':   return <RoomManagement setPage={setPage} />;
      case 'liveroommgmt': return <LiveRoomManagement setPage={setPage} />;
      case 'energyusage': return <EnergyUsageOverview setPage={setPage} />;
      case 'staffmgmt':  return <StaffManagement setPage={setPage} />;
      case 'staffverify': return <StaffVerification setPage={setPage} />;
      case 'checkinout': return <CheckInOut setPage={setPage} />;
      case 'usermgmt':   return <UserManagement setPage={setPage} />;
      case 'payment':    return <PaymentPage setPage={setPage} />;
      case 'enquiry':    return <EnquiryManagement setPage={setPage} />;
      default:           return <HomePage setPage={setPage} />;
    }
  };

  return (
    <div style={{ position: 'relative' }}>
      {isPublic && !userRole && <PublicNav page={page} setPage={setPage} transparent={page === 'home'} />}
      <div className={isAdmin || isCustomerDash ? '' : isPublic ? 'page-scroll' : ''} style={isAdmin || isCustomerDash ? {} : { overflowX: 'hidden' }}>
        <AuthContext.Provider value={session}>{renderPage()}</AuthContext.Provider>
      </div>

      {/* Nav Menu Bar at bottom — quick page switcher for demo */}
      {userRole && <div style={{
        position: 'fixed', bottom: 16, left: '50%', transform: 'translateX(-50%)',
        background: DS.c.navy, borderRadius: DS.r.full, boxShadow: DS.s.lg,
        padding: '8px 14px', display: 'flex', alignItems: 'center', gap: 4, zIndex: 9999,
        border: `1px solid rgba(201,169,110,0.2)`,
      }}>
        <div title="Giri Darshan Residency" style={{ width: 28, height: 28, borderRadius: '50%', background: `linear-gradient(135deg, ${DS.c.gold}, ${DS.c.goldDark})`, color: DS.c.navy, fontFamily: DS.f.serif, fontWeight: 700, fontSize: 11, display: 'flex', alignItems: 'center', justifyContent: 'center', marginRight: 6, flexShrink: 0 }}>GD</div>
        {[
          ['home','🏨','Home'],['rooms','bed-icon','Rooms'],['roomdetail','🔍','Detail'],
          ['booking','📋','Book'],['contact','✉️','Contact'],['customerdash','👤','My Stay'],
          ['staffverify','🪪','Verify'],['bookingmgmt','📁','Bookings'],['checkinout','🔑','Check-In'],['liveroommgmt','🏢','Live Rooms'],['energyusage','⚡','Energy'],['enquiry','💬','Enquiries'],
          ['admin','📊','Admin'],['roommgmt','🏠','Rooms Mgmt'],['staffmgmt','🧑‍💼','Staff'],['usermgmt','👥','Users'],['payment','💳','Payments'],
        ].filter(([p]) => rolePages.includes(p)).map(([p, emoji, label]) => (
          <button key={p} onClick={() => setPage(p)} title={label} style={{
            background: page === p ? DS.c.gold : 'transparent', border: 'none', cursor: 'pointer',
            width: 28, height: 28, borderRadius: '50%', fontSize: 13, display: 'flex', alignItems: 'center',
            justifyContent: 'center', transition: 'background 0.15s', flexShrink: 0,
          }}>{emoji === 'bed-icon' ? <Icon name="bed" size={15} color={page === p ? DS.c.navy : DS.c.white} /> : emoji}</button>
        ))}
        <button onClick={logout} title="Logout" style={{ background: 'transparent', border: 'none', cursor: 'pointer', width: 28, height: 28, borderRadius: '50%', fontSize: 13, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>🚪</button>
      </div>}

      {/* Tweaks Panel */}
      {tweaksVisible && (
        <div style={{
          position: 'fixed', bottom: 60, right: 20, background: DS.c.white,
          borderRadius: DS.r.xl, boxShadow: DS.s.lg, padding: '22px',
          width: 280, zIndex: 10000, border: `1px solid ${DS.c.borderLight}`,
        }}>
          <div style={{ fontFamily: DS.f.serif, fontSize: 18, fontWeight: 600, marginBottom: 18, paddingBottom: 12, borderBottom: `1px solid ${DS.c.border}` }}>Tweaks</div>

          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>Accent Color</label>
            <div style={{ display: 'flex', gap: 8 }}>
              {[['#C9A96E','Classic Gold'],['#8B6E3C','Deep Bronze'],['#5B8C5A','Forest'],['#4A7B9D','Azure'],['#8B4A6B','Rose Gold']].map(([c, l]) => (
                <div key={c} title={l} onClick={() => updateTweak('accentColor', c)} style={{ width: 28, height: 28, background: c, borderRadius: '50%', cursor: 'pointer', border: tweaks.accentColor === c ? `3px solid ${DS.c.navy}` : '3px solid transparent', transition: 'border 0.15s' }} />
              ))}
            </div>
          </div>

          <div style={{ marginBottom: 16 }}>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>View Demo Page</label>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
              {[['home','🏨 Home'],['rooms','🛏 Rooms'],['booking','📋 Booking'],['admin','📊 Admin'],['customerdash','👤 Dashboard'],['payment','💳 Payments']].map(([p, l]) => (
                <button key={p} onClick={() => setPage(p)} style={{ padding: '7px 10px', background: page === p ? DS.c.navy : DS.c.beigeLight, color: page === p ? DS.c.white : DS.c.textMid, border: 'none', borderRadius: DS.r.md, cursor: 'pointer', fontSize: 12, fontFamily: DS.f.sans, transition: 'all 0.15s' }}>{l}</button>
              ))}
            </div>
          </div>

          <div>
            <label style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.08em', color: DS.c.textMuted, display: 'block', marginBottom: 8 }}>Transparent Hero Nav</label>
            <div style={{ display: 'flex', gap: 6 }}>
              {[['true','Yes'],['false','No']].map(([v, l]) => (
                <button key={v} onClick={() => updateTweak('navTransparent', v === 'true')} style={{ flex: 1, padding: '7px', background: String(tweaks.navTransparent) === v ? DS.c.navy : DS.c.beigeLight, color: String(tweaks.navTransparent) === v ? DS.c.white : DS.c.textMid, border: 'none', borderRadius: DS.r.md, cursor: 'pointer', fontSize: 12, fontFamily: DS.f.sans }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// Mount app
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
