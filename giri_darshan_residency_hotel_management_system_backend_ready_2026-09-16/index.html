// ─── CSS INJECTION ────────────────────────────────────────────────────────────
const injectGlobalStyles = () => {
  const id = 'grand-azure-global';
  if (document.getElementById(id)) return;
  const style = document.createElement('style');
  style.id = id;
  style.textContent = `
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: ${DS.f.sans}; background: ${DS.c.ivory}; color: ${DS.c.text}; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: ${DS.c.beige}; }
    ::-webkit-scrollbar-thumb { background: ${DS.c.goldLight}; border-radius: 3px; }
    a { color: inherit; text-decoration: none; }
    input, select, textarea, button { font-family: inherit; }

    .ga-btn { display: inline-flex; align-items: center; gap: 6px; border: none; cursor: pointer; font-family: ${DS.f.sans}; font-weight: 500; letter-spacing: 0.04em; transition: all 0.2s ease; white-space: nowrap; }

    .ga-input { width: 100%; border: 1.5px solid ${DS.c.border}; border-radius: ${DS.r.md}; font-family: ${DS.f.sans}; font-size: 14px; color: ${DS.c.text}; background: ${DS.c.white}; transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    .ga-input:focus { border-color: ${DS.c.gold}; box-shadow: 0 0 0 3px rgba(201,169,110,0.15); }
    .ga-input::placeholder { color: ${DS.c.textMuted}; }

    .ga-card { background: ${DS.c.white}; border-radius: ${DS.r.lg}; box-shadow: ${DS.s.sm}; border: 1px solid ${DS.c.borderLight}; }
    .ga-card-hover { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .ga-card-hover:hover { transform: translateY(-3px); box-shadow: ${DS.s.md}; }

    .ga-table { width: 100%; border-collapse: collapse; }
    .ga-table th { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: ${DS.c.textMuted}; padding: 12px 16px; text-align: left; background: ${DS.c.beigeLight}; border-bottom: 1px solid ${DS.c.border}; }

    /* Scrollable page areas */
    .page-scroll { overflow-y: auto; height: 100vh; }

    /* Public nav */
    .pub-nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; transition: all 0.3s; }
    .pub-nav.solid { background: ${DS.c.white}; box-shadow: ${DS.s.sm}; }

      .rooms-filter-panel { position: relative !important; top: auto !important; margin-bottom: 20px; }
      .rooms-toolbar { align-items: stretch; }

      .modal-box { width: min(100%, calc(100vw - 24px)) !important; }

      [style*="padding: '48px 40px'"] { padding: 28px 16px !important; }
      .ga-sidebar { width: 56px !important; }
      .ga-sidebar-icon { font-size: 15px; }
    }
  `;
  document.head.appendChild(style);
};
injectGlobalStyles();

// ─── BUTTON ───────────────────────────────────────────────────────────────────
const Button = ({ children, variant = 'primary', size = 'md', onClick, style: st, icon, disabled, fullWidth }) => {
  const variants = {
    primary: { background: `linear-gradient(135deg, ${DS.c.gold} 0%, ${DS.c.goldDark} 100%)`, color: DS.c.navy, boxShadow: DS.s.gold },
    navy: { background: DS.c.navy, color: DS.c.white },
    outline: { background: 'transparent', color: DS.c.navy, border: `1.5px solid ${DS.c.navy}` },
    outlineGold: { background: 'transparent', color: DS.c.gold, border: `1.5px solid ${DS.c.gold}` },
    ghost: { background: 'transparent', color: DS.c.textMid },
    danger: { background: DS.c.danger, color: DS.c.white },
    success: { background: DS.c.success, color: DS.c.white },
  };
  const sizes = {
    xs: { padding: '5px 12px', fontSize: '11px', borderRadius: DS.r.md },
    sm: { padding: '7px 16px', fontSize: '12.5px', borderRadius: DS.r.md },
    md: { padding: '10px 22px', fontSize: '13.5px', borderRadius: DS.r.md },
    lg: { padding: '13px 30px', fontSize: '15px', borderRadius: DS.r.lg },
    xl: { padding: '16px 38px', fontSize: '16px', borderRadius: DS.r.lg },
  };
  return (
    <button
      className="ga-btn"
      disabled={disabled}
      onClick={onClick}
      style={{ ...variants[variant], ...sizes[size], width: fullWidth ? '100%' : 'auto', justifyContent: fullWidth ? 'center' : 'flex-start', ...st }}
    >
      {icon && <Icon name={icon} size={sizes[size].fontSize === '13.5px' ? 15 : 13} color="currentColor" />}
      {children}
    </button>
  );
};

const MiniBarChart = ({ data, color = DS.c.gold, height = 120, label }) => {

  return (
    <div>
      {label && <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '0.07em', textTransform: 'uppercase', color: DS.c.textMuted, marginBottom: 12 }}>{label}</div>}

              <div style={{ width: '100%', background: `linear-gradient(180deg, ${color} 0%, ${color}88 100%)`, borderRadius: '4px 4px 0 0', height: `${(d.value / max) * 100}%`, transition: 'height 0.5s ease' }} />
            </div>

          </div>
        ))}
      </div>
    </div>

};

// ─── MINI LINE CHART ──────────────────────────────────────────────────────────
const MiniLineChart = ({ data, color = DS.c.gold, height = 60 }) => {
  const vals = data.map(d => d.value);
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = max - min || 1;
  const w = 300, h = height;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / range) * (h - 10) - 5}`).join(' ');
  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: '100%', height }} preserveAspectRatio="none">
      <defs>
        <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.3" />
          <stop offset="100%" stopColor={color} stopOpacity="0.0" />
        </linearGradient>
      </defs>
      <polyline points={`0,${h} ${pts} ${w},${h}`} fill="url(#lg1)" stroke="none" />
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

// ─── DONUT CHART ──────────────────────────────────────────────────────────────
const DonutChart = ({ segments, size = 120, thickness = 22 }) => {
  const r = (size - thickness) / 2, cx = size / 2, cy = size / 2;
  const circ = 2 * Math.PI * r;
  let offset = 0;
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: 'rotate(-90deg)' }}>
      {segments.map((seg, i) => {
        const dash = (seg.value / total) * circ;
        const gap = circ - dash;
        const el = <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={seg.color} strokeWidth={thickness} strokeDasharray={`${dash} ${gap}`} strokeDashoffset={-offset} strokeLinecap="butt" />;
        offset += dash;
        return el;
      })}
    </svg>
  );
};

// ─── BOOKING PAGE ─────────────────────────────────────────────────────────────
const BookingPage = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [step, setStep] = React.useState(1);
  const [payment, setPayment] = React.useState('card');
  const [form, setForm] = React.useState({ firstName: '', lastName: '', email: '', phone: '', special: '' });
  const [bookingError, setBookingError] = React.useState('');

  const [roomType, setRoomType] = React.useState(() => { const id = Number(localStorage.getItem('gdr_room_type')); return ROOMS.find(r => r.id === id)?.type || ''; });
  const [adults, setAdults] = React.useState(() => { try { return Number(JSON.parse(localStorage.getItem('gdr_search') || '{}').guests) || 1; } catch (_) { return 1; } });
  const [kids, setKids] = React.useState(0);
  const [seniors, setSeniors] = React.useState(0);
  const [documentType, setDocumentType] = React.useState('');
  const [documentName, setDocumentName] = React.useState('');
  const [documentFile, setDocumentFile] = React.useState(null);
  const [verificationStatus, setVerificationStatus] = React.useState('Pending Document Upload');
  const [verificationMessage, setVerificationMessage] = React.useState('Guest must upload ID document before staff can verify and confirm booking.');
  const [verificationTone, setVerificationTone] = React.useState('warning');
  const [paymentError, setPaymentError] = React.useState('');

  const steps = ['Guest Details', 'Payment', 'Verification', 'Confirmation'];
  const roomOptions = ROOMS.filter(r => r.status !== 'maintenance').map(r => ({ value: r.type, label: r.type }));
  const selectedRoom = ROOMS.find(r => r.type === roomType) || ROOMS[0] || null;
  const effectiveAdults = Number(adults) > 0 ? Number(adults) : 1;
  const guestTotal = effectiveAdults + Number(kids || 0) + Number(seniors || 0);
  const [checkIn, setCheckIn] = React.useState(() => { try { return JSON.parse(localStorage.getItem('gdr_search') || '{}').checkIn || ''; } catch (_) { return ''; } });
  const [checkOut, setCheckOut] = React.useState(() => { try { return JSON.parse(localStorage.getItem('gdr_search') || '{}').checkOut || ''; } catch (_) { return ''; } });
  const [bookingId, setBookingId] = React.useState('');
  const nights = (checkIn && checkOut) ? Math.max(0, Math.ceil((new Date(checkOut) - new Date(checkIn)) / 86400000)) : 0;

  const createBooking = async () => {
    setBookingError('');
    if (!session?.token) { setBookingError('Please sign in before creating a booking.'); return; }
    if (!checkIn || !checkOut || nights < 1) { setBookingError('Choose valid check-in and check-out dates.'); return; }
    if (guestTotal < 1 || (selectedRoom.capacity && guestTotal > selectedRoom.capacity)) { setBookingError('Check the guest count for this room.'); return; }
    try {
      const response = await fetch('http://localhost:5000/api/bookings', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ roomTypeId: selectedRoom.id, checkInDate: checkIn, checkOutDate: checkOut, adults: effectiveAdults, children: kids, seniors, primaryGuestName: `${form.firstName} ${form.lastName}`.trim(), specialRequest: form.special }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Booking could not be created.');
      setBookingId(String(data.id));
      setStep(2);
    } catch (error) { setBookingError(error.message); }
  };
  const recordDemoPayment = async () => {
    setPaymentError('');
    try {
      const response = await fetch(`http://localhost:5000/api/payments/${bookingId}`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ paymentMethod: payment, paymentStatus: 'paid' }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Payment could not be recorded.');
      setStep(3);
    } catch (error) { setPaymentError(error.message); }
  };

  if (!selectedRoom) {
    return (
      <div style={{ paddingTop: 68, background: DS.c.ivory, minHeight: '100vh' }}>
        <PublicNav page="booking" setPage={setPage} />
        <div style={{ maxWidth: 900, margin: '0 auto', padding: '80px 40px' }}>
          <div className="ga-card" style={{ padding: 36, textAlign: 'center' }}>
            <h1 style={{ fontFamily: DS.f.serif, fontSize: 34, color: DS.c.text, marginBottom: 12 }}>No Room Records Available</h1>
            <p style={{ color: DS.c.textMuted, lineHeight: 1.7, marginBottom: 24 }}>The booking form is ready, but room records must be loaded from the database before a real booking can be created.</p>
            <Button variant="primary" onClick={() => setPage('rooms')}>View Rooms</Button>
          </div>
        </div>
        <Footer setPage={setPage} />
      </div>
    );
  }

  const verifyBooking = async () => {
    if (guestTotal < 1) {
      setVerificationStatus('Booking Validation Failed');
      setVerificationTone('error');
      setVerificationMessage('Please enter at least one guest before continuing.');
      return;
    }

    if (selectedRoom.capacity && guestTotal > selectedRoom.capacity) {
      setVerificationStatus('Booking Validation Failed');
      setVerificationTone('error');
      setVerificationMessage(`${selectedRoom.type} allows maximum ${selectedRoom.capacity} guests. Please reduce guest count or choose a larger room.`);
      return;
    }

    if (!documentType) {
      setVerificationStatus('Missing Document Type');
      setVerificationTone('error');
      setVerificationMessage('Please select the document type before submitting verification.');
      return;
    }

    if (!documentName) {
      setVerificationStatus('Missing ID Document');
      setVerificationTone('error');
      setVerificationMessage('Please upload a valid ID document before continuing to booking confirmation.');
      return;
    }

    const verificationData = {
      bookingId,
      guestName: `${form.firstName || ''} ${form.lastName || ''}`.trim(),
      roomType: selectedRoom.type,
      guestCount: guestTotal,
      adults,
      kids,
      seniors,
      documentType,
      documentName,
      status: 'Pending Staff Verification'
    };

    try {
      if (!documentFile) throw new Error('Select the document file again.');
      if (documentFile.size > 5 * 1024 * 1024) throw new Error('Document must be smaller than 5 MB.');
      const fileData = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = () => reject(new Error('Could not read document.')); reader.readAsDataURL(documentFile); });
      const response = await fetch(`http://localhost:5000/api/verifications/${bookingId}/upload`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session?.token || ''}` },
        body: JSON.stringify({ documentType: ({'Adhar Card':'aadhaar_card','Passport':'passport','National ID':'national_id','Driving Licence':'drivers_license'})[documentType] || documentType, fileData })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Verification upload failed.');
      verificationData.verificationId = data.verificationId;
      verificationData.status = 'Pending Staff Verification';
      try { localStorage.setItem('verificationData', JSON.stringify(verificationData)); } catch(e) {}
    } catch (error) {
      setVerificationStatus('Upload Failed');
      setVerificationTone('error');
      setVerificationMessage(error.message);
      return;
    }

    setVerificationStatus('Document Uploaded');
    setVerificationTone('success');
    setVerificationMessage('Document uploaded successfully. Booking is now waiting for staff verification and can continue to confirmation.');
    setStep(4);
  };

  const Summary = () => (
    <div className="ga-card" style={{ padding: '22px' }}>
      <div style={{ fontFamily: DS.f.serif, fontSize: 18, fontWeight: 600, marginBottom: 14, paddingBottom: 12, borderBottom: `1px solid ${DS.c.border}` }}>Booking Summary</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 14, fontSize: 13 }}>
        {[
          ['Check-In', checkIn || ''],
          ['Check-Out', checkOut || ''],
          ['Duration', nights ? `${nights} night${nights > 1 ? 's' : ''}` : ''],
          ['Guests', guestTotal > 0 ? `${adults} Adults · ${kids} Kids · ${seniors} Seniors` : ''],

                  <div key={n} style={{ padding: '12px', borderRadius: DS.r.md, background: state === 'complete' ? DS.c.successBg : state === 'active' ? `${DS.c.gold}14` : DS.c.beigeLight, border: `1px solid ${state === 'complete' ? DS.c.success : state === 'active' ? DS.c.gold : DS.c.borderLight}` }}>

              <div style={{ width: 72, height: 72, borderRadius: '50%', background: DS.c.successBg, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 20px', border: `2px solid ${DS.c.success}` }}>
                <Icon name="check" size={32} color={DS.c.success} />
              </div>
              <h2 style={{ fontFamily: DS.f.serif, fontSize: 30, fontWeight: 600, marginBottom: 8 }}>Booking Confirmed!</h2>
              <p style={{ fontSize: 15, color: DS.c.textMid, marginBottom: 24 }}>Your reservation at Giri Darshan Residency has been confirmed. A confirmation email has been sent to your address.</p>
              <div style={{ background: DS.c.beigeLight, borderRadius: DS.r.lg, padding: '20px', marginBottom: 28, display: 'inline-block', textAlign: 'left', width: '100%', maxWidth: 420 }}>

                  ['Booking ID', bookingId],
                  ['Room', selectedRoom.type],
                  ['Guests', `${adults} Adults · ${kids} Kids · ${seniors} Seniors`],

                  ['Check-Out', 'Selected during booking'],

                  <div key={l} style={{ display: 'flex', justifyContent: 'space-between', gap: 12, marginBottom: 10, fontSize: 13.5 }}>

                <Button variant="primary" size="md" onClick={() => setPage('customerdash')}>View My Bookings</Button>
                <Button variant="outline" size="md" onClick={() => setPage('home')}>Return Home</Button>
              </div>
            </div>
          )}
        </div>
        <Summary />
      </div>
      <Footer setPage={setPage} />
    </div>
  );
};

  const [lastName, setLastName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [error, setError] = React.useState('');
  const request = React.useRef(null);

  const loginAs = async (register = false) => {
    if (busy) return;
    if (register && role !== 'customer') { setError('Staff accounts must be created by an administrator.'); return; }
    if (register && (!firstName.trim() || !lastName.trim() || firstName.trim().length > 80 || lastName.trim().length > 80 || phone.trim().length > 30)) { setError('Enter your first and last name (up to 80 characters each) and a phone number up to 30 characters.'); return; }
    if (register && (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim()) || email.trim().length > 160)) { setError('Enter a valid email address.'); return; }
    if (register && (password.length < 8 || new TextEncoder().encode(password).length > 72)) { setError('Use at least 8 characters and no more than 72 bytes for your password.'); return; }
    if (!email.trim() || !password) { setError('Enter your email and password.'); return; }
    setBusy(true);
    setError('');
    request.current = new AbortController();
    const timeout = setTimeout(() => request.current?.abort(), 15000);
    try {
      const response = await fetch(AUTH_API + (register ? '/register' : '/login'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.trim(), password, role, ...(register ? { firstName: firstName.trim(), lastName: lastName.trim(), phone: phone.trim() } : {}) }),
        signal: request.current.signal
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Sign in failed.');
      if (!data.token || !['customer', 'staff', 'admin'].includes(data.user?.role)) throw new Error('Invalid login response.');
      setPassword('');
      setSession({ token: data.token, user: data.user });
      setPage(data.user.role === 'admin' ? 'admin' : data.user.role === 'staff' ? 'staffverify' : 'customerdash');
    } catch (err) {
      setError(err.name === 'AbortError' ? 'Request timed out. If you were creating an account, try signing in before submitting again.' : err instanceof TypeError ? 'Cannot reach the backend. Start the local API and try again.' : err.message);
    } finally { clearTimeout(timeout); setBusy(false); }
  };

            <div style={{ marginTop: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
              {[['checkin', `Process Check-Ins (${summary?.active_bookings || 0})`, 'checkinout'], ['checkout', 'Process Check-Outs', 'checkinout']].map(([ic, l, p]) => (
                <button key={l} onClick={() => setPage(p)} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '9px 12px', background: DS.c.navy, border: 'none', borderRadius: DS.r.md, cursor: 'pointer', color: DS.c.goldLight, fontSize: 12, fontFamily: DS.f.sans, fontWeight: 500, transition: 'opacity 0.2s' }}>

          </div>
        </div>
      </div>

  );
};

// ─── BOOKING MANAGEMENT ───────────────────────────────────────────────────────
const BookingManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [liveBookings, setLiveBookings] = React.useState(null);
  const [actionError, setActionError] = React.useState('');
  const [cancelling, setCancelling] = React.useState(null);
  const cancelBooking = async (booking) => {
    if (cancelling !== null) return;
    setCancelling(booking.bookingId); setActionError('');
    try {
      const r = await fetch(`http://localhost:5000/api/bookings/${booking.bookingId}/status`, {method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({status:'cancelled'})});
      const d=await r.json(); if(!r.ok) throw new Error(d.message);
      setLiveBookings(rows=>rows.map(b=>b.bookingId===booking.bookingId?{...b,status:'cancelled'}:b));
    } catch(e){setActionError(e.message);} finally {setCancelling(null);}
  };
  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState('all');
  const [selected, setSelected] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/bookings', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => {
      if (Array.isArray(rows)) setLiveBookings(rows.map(b => ({ id: b.booking_ref, guest: b.customer_name, room: b.room_type, checkIn: b.check_in_date?.slice(0,10), checkOut: b.check_out_date?.slice(0,10), nights: Math.max(0, Math.ceil((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000)), total: Number(b.total_amount_inr || 0), paid: b.payment_status === 'paid', status: b.booking_status, bookingId: b.booking_id })));
    }).catch(() => {});
  }, [session?.token]);

  const bookingRows = liveBookings || BOOKINGS_SAMPLE;
  const filtered = bookingRows.filter(b => {
    const statuses = {checkedin:['checked_in'],checkedout:['checked_out'],pending:['pending','awaiting_payment','awaiting_verification']};
    if (filter !== 'all' && !(statuses[filter] || [filter]).includes(b.status)) return false;
    if (search && !b.guest.toLowerCase().includes(search.toLowerCase()) && !b.id.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  return (
    <AdminLayout page="bookingmgmt" setPage={setPage} title="Booking Management" subtitle="Manage all hotel reservations">
      <div style={{ padding: '24px 28px' }}>
        {actionError && <p role="alert" style={{color:DS.c.danger}}>{actionError}</p>}
        {/* Filters */}
        <div className="ga-card" style={{ padding: '16px 20px', marginBottom: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {['all', 'confirmed', 'checkedin', 'checkedout', 'pending', 'cancelled'].map(f => (
              <button key={f} className={`ga-tab ${filter === f ? 'active' : ''}`} style={{ fontSize: 12, padding: '6px 14px' }} onClick={() => setFilter(f)}>
                {f === 'all' ? 'All' : f.charAt(0).toUpperCase() + f.slice(1)}
              </button>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 10 }}>
            <div style={{ position: 'relative' }}>
              <input className="ga-input" placeholder="Search bookings…" value={search} onChange={e => setSearch(e.target.value)} style={{ padding: '8px 14px 8px 34px', width: 220, fontSize: 13 }} />
              <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: DS.c.textMuted }}><Icon name="search" size={14} /></span>
            </div>
            <Button variant="primary" size="sm" icon="plus" onClick={() => { setSelected(null); setShowModal(true); }}>New Booking</Button>
          </div>
        </div>

        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <table className="ga-table">
            <thead>
              <tr><th>Booking ID</th><th>Guest</th><th>Room</th><th>Check-In</th><th>Check-Out</th><th>Nights</th><th>Amount</th><th>Payment</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody>
              {filtered.map(b => (
                <tr key={b.id} style={{ cursor: 'pointer' }} onClick={() => { setSelected(b); setShowModal(true); }}>
                  <td style={{ fontFamily: DS.f.serif, fontWeight: 600, color: DS.c.navy }}>{b.id}</td>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 28, height: 28, borderRadius: '50%', background: `${DS.c.gold}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, color: DS.c.goldDark }}>{b.guest[0]}</div>
                      <span style={{ fontWeight: 500 }}>{b.guest}</span>
                    </div>
                  </td>
                  <td>{b.room}</td>
                  <td>{b.checkIn}</td>
                  <td>{b.checkOut}</td>
                  <td style={{ textAlign: 'center' }}>{b.nights}</td>
                  <td style={{ fontWeight: 600 }}>A${b.total.toLocaleString()}</td>
                  <td><Badge status={b.paid ? 'paid' : 'unpaid'} text={b.paid ? 'Paid' : 'Unpaid'} /></td>
                  <td><Badge status={b.status} text={b.status} /></td>
                  <td onClick={e => e.stopPropagation()}>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info, padding: 4 }} title="Edit"><Icon name="edit" size={14} /></button>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger, padding: 4 }} title="Cancel" disabled={cancelling !== null || ['cancelled','checked_in','checked_out'].includes(b.status)} onClick={() => cancelBooking(b)}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {filtered.length === 0 && <div style={{ textAlign: 'center', padding: '40px', color: DS.c.textMuted, fontSize: 14 }}>No bookings found matching your search.</div>}
        </div>
      </div>

      {/* Booking Detail Modal */}
      <Modal open={showModal} onClose={() => setShowModal(false)} title={selected ? `Booking ${selected.id}` : 'New Booking'} width={580}>
        {selected ? (
          <div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 20 }}>
              {[['Guest Name', selected.guest], ['Room', selected.room], ['Check-In', selected.checkIn], ['Check-Out', selected.checkOut], ['Nights', selected.nights], ['Total Amount', `A${selected.total.toLocaleString()}`]].map(([l, v]) => (
                <div key={l} style={{ padding: '12px 14px', background: DS.c.beigeLight, borderRadius: DS.r.md }}>
                  <div style={{ fontSize: 11, color: DS.c.textMuted, marginBottom: 3, textTransform: 'uppercase', letterSpacing: '0.06em' }}>{l}</div>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{v}</div>
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10, marginBottom: 16 }}>
              <Badge status={selected.status} text={selected.status} />
              <Badge status={selected.paid ? 'paid' : 'unpaid'} text={selected.paid ? 'Paid' : 'Unpaid'} />
            </div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <Button variant="primary" size="sm" icon="edit">Update Status</Button>
              <Button variant="success" size="sm" icon="checkin" onClick={() => setPage('checkinout')}>Check In</Button>
              <Button variant="outline" size="sm" icon="download">Invoice</Button>
              <Button variant="danger" size="sm" icon="trash">Cancel</Button>
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <Input label="Guest Name" placeholder="Full name" required />
              <Input label="Phone" placeholder="Phone number" required />
            </div>
            <Select label="Room" options={ROOMS.map(r => ({ value: r.id, label: `${r.type} (Floor ${r.floor})` }))} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
              <Input label="Check-In" type="date" required />
              <Input label="Check-Out" type="date" required />
            </div>
            <Select label="Number of Guests" options={[{value:'1',label:'1'},{value:'2',label:'2'},{value:'3',label:'3'},{value:'4',label:'4'}]} />
            <Button variant="primary" size="md" fullWidth icon="plus">Create Booking</Button>
          </div>
        )}
      </Modal>
    </AdminLayout>
  );
};

// ─── ROOM MANAGEMENT ──────────────────────────────────────────────────────────
const RoomManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [liveRooms, setLiveRooms] = React.useState(null);
  const [showModal, setShowModal] = React.useState(false);
  const [editRoom, setEditRoom] = React.useState(null);
  const [saveError, setSaveError] = React.useState('');
  const [saving, setSaving] = React.useState(false);
  const [roomTypes, setRoomTypes] = React.useState([]);
  const [draft, setDraft] = React.useState({roomNumber:'', roomTypeId:'', floorNumber:'', status:'available'});
  React.useEffect(() => { fetch('http://localhost:5000/api/rooms/types').then(async r => { if (!r.ok) throw new Error('Cannot load room types.'); return r.json(); }).then(setRoomTypes).catch(e => setSaveError(e.message)); }, []);
  const [view, setView] = React.useState('grid');
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/rooms', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => Array.isArray(rows) && setLiveRooms(rows.map(r => ({ id: r.id, number: r.room_number, roomTypeId: r.room_type_id, type: r.type_name, price: Number(r.base_price_inr || 0), capacity: r.max_capacity, floor: r.floor_number, size: r.size_sqm ? `${r.size_sqm} sqm` : '', beds: r.bedrooms ? `${r.bedrooms} bed` : '', view: '', status: r.status, rating: '' })))).catch(() => {});
  }, [session?.token]);
  const roomRows = liveRooms || ROOMS;
  const deleteRoom = async (id) => {
    if (!session?.token) return;
    const response = await fetch(`http://localhost:5000/api/rooms/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${session.token}` } });
    if (response.ok) setLiveRooms(items => (items || []).filter(room => room.id !== id));
  };
  const saveRoom = async () => {
    if (saving) return;
    setSaveError('');
    if (!editRoom && (!draft.roomNumber.trim() || !draft.roomTypeId)) { setSaveError('Enter a room number and select its type.'); return; }
    if (!session?.token) { setSaveError('Please sign in again.'); return; }
    setSaving(true);
    try {
      const response = await fetch(`http://localhost:5000/api/rooms${editRoom ? '/' + editRoom.id : ''}`, { method: editRoom ? 'PATCH' : 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify(editRoom ? { status: editRoom.status } : {...draft, roomNumber:draft.roomNumber.trim(), floorNumber:draft.floorNumber === '' ? null : Number(draft.floorNumber)}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Room could not be saved.');
      if (editRoom) setLiveRooms(items => (items || []).map(room => room.id === editRoom.id ? { ...room, status: editRoom.status } : room));
      if (!editRoom) { const type = roomTypes.find(r => String(r.id) === String(draft.roomTypeId)); setLiveRooms(items => [...(items || []), {id:data.id, number:draft.roomNumber, roomTypeId:draft.roomTypeId, type:type.type_name, price:Number(type.base_price_inr || 0), capacity:type.max_capacity, floor:draft.floorNumber, status:draft.status, size:'', rating:''}]); setDraft({roomNumber:'',roomTypeId:'',floorNumber:'',status:'available'}); }
      setShowModal(false);
    } catch (error) { setSaveError(error.message); }
    finally { setSaving(false); }
  };


  return (
    <AdminLayout page="roommgmt" setPage={setPage} title="Room Management" subtitle="Manage rooms, availability and pricing">
      <div style={{ padding: '24px 28px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {['grid', 'table'].map(v => (
              <button key={v} className={`ga-tab ${view === v ? 'active' : ''}`} style={{ fontSize: 12 }} onClick={() => setView(v)}>
                {v.charAt(0).toUpperCase() + v.slice(1)} View
              </button>
            ))}
          </div>
          <Button variant="primary" size="sm" icon="plus" onClick={() => { setEditRoom(null); setShowModal(true); }}>Add New Room</Button>
        </div>

        {view === 'grid' ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 18 }}>
            {roomRows.map(room => (
              <div key={room.id} className="ga-card" style={{ overflow: 'hidden' }}>
                <div style={{ position: 'relative' }}>
                  <RoomImgPlaceholder type={room.type} height={150} />
                  <div style={{ position: 'absolute', top: 10, right: 10 }}><Badge status={room.status} text={room.status} /></div>
                  <div style={{ position: 'absolute', bottom: 10, left: 10, background: 'rgba(11,22,40,0.7)', borderRadius: DS.r.sm, padding: '3px 8px' }}>
                    <span style={{ fontFamily: DS.f.serif, color: DS.c.gold, fontSize: 15, fontWeight: 600 }}>{formatRoomPrice(room)}</span>
                    <span style={{ fontSize: 10, color: 'rgba(255,255,255,0.6)' }}>{room.price ? '/night' : ''}</span>
                  </div>
                </div>
                <div style={{ padding: '14px 16px' }}>
                  <div style={{ fontFamily: DS.f.serif, fontSize: 16, fontWeight: 600, marginBottom: 4 }}>{room.type}</div>
                  <div style={{ fontSize: 12, color: DS.c.textMuted, marginBottom: 10 }}>{formatRoomMeta(room)}</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <Button variant="outline" size="xs" icon="edit" onClick={() => { setEditRoom(room); setShowModal(true); }}>Edit</Button>
                    <Button variant="ghost" size="xs" icon="eye">Preview</Button>
                    <Button variant="ghost" size="xs" style={{ color: DS.c.danger, marginLeft: 'auto' }} icon="trash" onClick={() => deleteRoom(room.id)}>Delete</Button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        ) : (
          <div className="ga-card" style={{ overflow: 'hidden' }}>
            <table className="ga-table">
              <thead><tr><th>Room</th><th>Type</th><th>Floor</th><th>Capacity</th><th>Size</th><th>Price/Night</th><th>Status</th><th>Rating</th><th>Actions</th></tr></thead>
              <tbody>
                {roomRows.map(r => (
                  <tr key={r.id}>
                    <td style={{ fontWeight: 600 }}>#{r.number || r.id}</td>
                    <td>{r.type}</td>
                    <td>{r.floor ? `Floor ${r.floor}` : 'From database'}</td>
                    <td>{r.capacity ? `${r.capacity} guests` : 'From database'}</td>
                    <td>{r.size}</td>
                    <td style={{ fontWeight: 600, color: DS.c.gold }}>{formatRoomPrice(r)}</td>
                    <td><Badge status={r.status} text={formatRoomStatus(r)} /></td>
                    <td><span style={{ color: DS.c.gold }}>★</span> {r.rating}</td>
                    <td>
                      <div style={{ display: 'flex', gap: 6 }}>
                        <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info }} onClick={() => { setEditRoom(r); setShowModal(true); }}><Icon name="edit" size={14} /></button>
                        <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger }} onClick={() => deleteRoom(r.id)}><Icon name="trash" size={14} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title={editRoom ? `Edit — ${editRoom.type}` : 'Add New Room'} width={600}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Select label="Room Type" disabled={!!editRoom} value={editRoom ? editRoom.roomTypeId : draft.roomTypeId} onChange={e => setDraft({...draft,roomTypeId:e.target.value})} options={[{value:'',label:'Select room type'}, ...roomTypes.map(r => ({value:String(r.id),label:r.type_name}))]} />
            <Input label="Room Number" placeholder="e.g. 501" readOnly={!!editRoom} value={editRoom ? editRoom.number || '' : draft.roomNumber} onChange={e => setDraft({...draft,roomNumber:e.target.value})} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 14 }}>
            <Input label="Floor" placeholder="Floor number" readOnly={!!editRoom} value={editRoom ? editRoom.floor || '' : draft.floorNumber} onChange={e => setDraft({...draft,floorNumber:e.target.value})} />
            <Input label="Size (sqm)" placeholder="e.g. 38" defaultValue={editRoom?.size?.replace(' sqm','')} />
            <Select label="Capacity" options={[{value:'1',label:'1 Guest'},{value:'2',label:'2 Guests'},{value:'3',label:'3 Guests'},{value:'4',label:'4 Guests'}]} />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Input label="Price per Night (A$)" placeholder="e.g. 380" defaultValue={editRoom?.price} />
            <Select label="View Type" options={[{value:'mountain',label:'Mountain View'},{value:'city',label:'City View'},{value:'temple',label:'Temple Area'},{value:'database',label:'From Database'}]} />
          </div>
          <Select label="Status" value={editRoom ? editRoom.status : draft.status} onChange={e => editRoom ? setEditRoom({...editRoom,status:e.target.value}) : setDraft({...draft,status:e.target.value})} options={[{value:'available',label:'Available'},{value:'booked',label:'Booked'},{value:'occupied',label:'Occupied'},{value:'inactive',label:'Inactive'},{value:'maintenance',label:'Under Maintenance'}]} />
          <div>
            <label style={{ fontSize: 12, fontWeight: 600, letterSpacing: '0.05em', color: DS.c.textMid, textTransform: 'uppercase', display: 'block', marginBottom: 6 }}>Description</label>
            <textarea className="ga-input" style={{ padding: '10px 14px', minHeight: 72, resize: 'vertical' }} placeholder="Room description for guests…" />
          </div>
          {saveError && <p role="alert" style={{color: DS.c.danger}}>{saveError}</p>}
          <div style={{ display: 'flex', gap: 10 }}>
            <Button disabled={saving} variant="primary" size="md" icon={editRoom ? 'check' : 'plus'} fullWidth onClick={saveRoom}>{editRoom ? 'Save Changes' : 'Add Room'}</Button>
            <Button variant="outline" size="md" onClick={() => setShowModal(false)}>Cancel</Button>
          </div>
        </div>
      </Modal>
    </AdminLayout>
  );
};

// ─── CHECK-IN / CHECK-OUT ─────────────────────────────────────────────────────
const CheckInOut = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [bookings, setBookings] = React.useState([]);
  const [lookup, setLookup] = React.useState('');
  const [found, setFound] = React.useState(null);
  const [tab, setTab] = React.useState('checkin');
  React.useEffect(() => { if (session?.token) fetch('http://localhost:5000/api/bookings', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => Array.isArray(rows) && setBookings(rows.map(b => ({ id:b.booking_ref, bookingId:b.booking_id, guest:b.customer_name, room:b.room_type, checkIn:String(b.check_in_date).slice(0,10), checkOut:String(b.check_out_date).slice(0,10), nights:Math.ceil((new Date(b.check_out_date)-new Date(b.check_in_date))/86400000), total:Number(b.total_amount_inr||0), status:b.booking_status })))).catch(() => {}); }, [session?.token]);

  const doSearch = () => {
    const source = bookings.length ? bookings : BOOKINGS_SAMPLE;
    const b = source.find(b => b.id.includes(lookup.toUpperCase()) || b.guest.toLowerCase().includes(lookup.toLowerCase()));
    setFound(b || 'notfound');
  };

  const sourceBookings = bookings.length ? bookings : BOOKINGS_SAMPLE;
  const todayCheckIns = sourceBookings.filter(b => ['confirmed','awaiting_verification'].includes(b.status)).slice(0, 3);
  const todayCheckOuts = sourceBookings.filter(b => b.status === 'checked_in' || b.status === 'checkedin').slice(0, 2);
  const updateStatus = async (status) => { if (!found?.bookingId) return; const r = await fetch(`http://localhost:5000/api/bookings/${found.bookingId}/status`, { method:'PATCH', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.token}`}, body:JSON.stringify({status}) }); if (r.ok) setFound({...found, status}); };

  return (
    <AdminLayout page="checkinout" setPage={setPage} title="Check-In / Check-Out" subtitle="Process guest arrivals and departures">
      <div style={{ padding: '24px 28px' }}>
        {/* Quick stats */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Expected Arrivals" value="0" sub="No records loaded" icon="checkin" color={DS.c.success} />
          <StatCard label="Expected Departures" value="0" sub="No records loaded" icon="checkout" color={DS.c.warning} />
          <StatCard label="Currently Checked In" value="0" sub="No records loaded" icon="users" />
          <StatCard label="Rooms Ready" value="0" sub="No records loaded" icon="rooms" color={DS.c.gold} />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 360px', gap: 20 }}>
          {/* Left: Lookup + Lists */}
          <div>
            {/* Search */}
            <div className="ga-card" style={{ padding: '22px', marginBottom: 18 }}>

                    {(found.status === 'checkedin' || found.status === 'checked_in') && <Button variant="primary" size="sm" icon="checkout" fullWidth onClick={() => updateStatus('checked_out')}>Process Check-Out</Button>}
                    <Button variant="outline" size="sm" icon="download">Invoice</Button>

            {/* Tabs: expected today */}

              <div style={{ padding: '14px 18px', borderBottom: `1px solid ${DS.c.border}`, display: 'flex', gap: 4 }}>

                  <button key={t} className={`ga-tab ${tab === t ? 'active' : ''}`} style={{ fontSize: 12 }} onClick={() => setTab(t)}>
                    {t === 'checkin' ? `Arrivals Today (${todayCheckIns.length})` : `Departures Today (${todayCheckOuts.length})`}

              </div>
              <table className="ga-table">
                <thead><tr><th>Guest</th><th>Room</th><th>Booking ID</th><th>Amount</th><th>Action</th></tr></thead>

                    <tr><td colSpan="5" style={{ textAlign: 'center', padding: 24, color: DS.c.textMuted }}>No check-in or check-out records loaded from database.</td></tr>

};

// ─── USER MANAGEMENT ──────────────────────────────────────────────────────────
const UserManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [users, setUsers] = React.useState([]);
  const [showModal, setShowModal] = React.useState(false);
  const [search, setSearch] = React.useState('');
  const [roleFilter, setRoleFilter] = React.useState('all');
  const [error, setError] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [draft, setDraft] = React.useState({firstName:'',lastName:'',email:'',phone:'',password:'',role:'customer'});
  const createUser = async () => {
    if (busy) return;
    setBusy(true); setError('');
    try {
      const r = await fetch('http://localhost:5000/api/users', {method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify(draft)});
      const d = await r.json(); if (!r.ok) throw new Error(d.message);
      setUsers(rows => [...rows,{id:d.id,name:`${draft.firstName} ${draft.lastName}`,email:draft.email,role:draft.role,status:'active',joined:new Date().toLocaleDateString()}]);
      setDraft({firstName:'',lastName:'',email:'',phone:'',password:'',role:'customer'}); setShowModal(false);
    } catch(e) {setError(e.message);} finally {setBusy(false);}
  };
  const changeStatus = async (id, status) => {
    setError('');
    try {
      const r = await fetch(`http://localhost:5000/api/users/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session.token}`},body:JSON.stringify({status})});
      const d=await r.json();if(!r.ok)throw new Error(d.message);
      setUsers(rows=>rows.map(u=>u.id===id?{...u,status}:u));
    } catch(e){setError(e.message);}
  };
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/users', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => Array.isArray(rows) && setUsers(rows.map(u => ({ id: u.id, name: `${u.first_name} ${u.last_name}`, email: u.email, role: u.role, joined: u.created_at ? new Date(u.created_at).toLocaleDateString() : '', status: u.status })))).catch(() => {});
  }, [session?.token]);

  return (
    <AdminLayout page="usermgmt" setPage={setPage} title="User Management" subtitle="Staff, customers and role permissions">
      <div style={{ padding: '24px 28px' }}>
        {error && <p role="alert" style={{color:DS.c.danger}}>{error}</p>}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Total Users" value={String(users.length)} sub="Loaded from database" icon="users" />
          <StatCard label="Active Staff" value={String(users.filter(u => u.role === 'staff' && u.status === 'active').length)} sub="Active staff accounts" icon="user" color={DS.c.info} />
          <StatCard label="New This Month" value={String(users.filter(u => u.joined && new Date(u.joined).getMonth() === new Date().getMonth()).length)} sub="Recent accounts" icon="plus" color={DS.c.success} trend={0} />
        </div>

        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <div style={{ padding: '16px 20px', borderBottom: `1px solid ${DS.c.border}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div style={{ display: 'flex', gap: 4 }}>
              {['all', 'admin', 'staff', 'customer'].map(r => (
                <button key={r} className={`ga-tab ${roleFilter === r ? 'active' : ''}`} onClick={() => setRoleFilter(r)} style={{ fontSize: 12 }}>{r.charAt(0).toUpperCase() + r.slice(1)}</button>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <div style={{ position: 'relative' }}>
                <input className="ga-input" placeholder="Search users…" value={search} onChange={e => setSearch(e.target.value)} style={{ padding: '7px 14px 7px 32px', width: 200, fontSize: 13 }} />
                <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: DS.c.textMuted }}><Icon name="search" size={13} /></span>
              </div>
              <Button variant="primary" size="sm" icon="plus" onClick={() => setShowModal(true)}>Add User</Button>
            </div>
          </div>
          <table className="ga-table">
            <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th><th>Bookings</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {users.filter(u => (roleFilter === 'all' || u.role === roleFilter) && `${u.name} ${u.email}`.toLowerCase().includes(search.toLowerCase())).map(u => (
                <tr key={u.id}>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <div style={{ width: 32, height: 32, borderRadius: '50%', background: u.role === 'admin' ? `linear-gradient(135deg, ${DS.c.gold}, ${DS.c.goldDark})` : `${DS.c.navy}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 600, color: u.role === 'admin' ? DS.c.navy : DS.c.navyMid }}>{u.name[0]}</div>
                      <span style={{ fontWeight: 500 }}>{u.name}</span>
                    </div>
                  </td>
                  <td style={{ fontSize: 13, color: DS.c.textMuted }}>{u.email}</td>
                  <td><Badge status={u.role} text={u.role} /></td>
                  <td style={{ fontSize: 13 }}>{u.joined}</td>
                  <td style={{ textAlign: 'center', fontWeight: 500 }}>{u.bookings || '—'}</td>
                  <td><Badge status={u.status === 'active' ? 'confirmed' : 'cancelled'} text={u.status} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.info }} title="Activate account" onClick={() => changeStatus(u.id, 'active')}><Icon name="edit" size={14} /></button>
                      <button style={{ background: 'none', border: 'none', cursor: 'pointer', color: DS.c.danger }} title="Deactivate account" onClick={() => changeStatus(u.id, 'inactive')}><Icon name="trash" size={14} /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title="Add New User" width={480}>
        {error && <p role="alert" style={{color:DS.c.danger}}>{error}</p>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
            <Input value={draft.firstName} onChange={e => setDraft({...draft,firstName:e.target.value})} label="First Name" placeholder="First name" required />
            <Input value={draft.lastName} onChange={e => setDraft({...draft,lastName:e.target.value})} label="Last Name" placeholder="Last name" required />
          </div>
          <Input value={draft.email} onChange={e => setDraft({...draft,email:e.target.value})} label="Email" type="email" placeholder="user@example.com" required />
          <Input value={draft.phone} onChange={e => setDraft({...draft,phone:e.target.value})} label="Phone" placeholder="Phone number" />
          <Select value={draft.role} onChange={e => setDraft({...draft,role:e.target.value})} label="Role" options={[{value:'customer',label:'Customer'},{value:'staff',label:'Hotel Staff'},{value:'admin',label:'Administrator'}]} />
          <Input value={draft.password} onChange={e => setDraft({...draft,password:e.target.value})} label="Temporary Password" type="password" placeholder="Min. 8 characters" required />
          <Button variant="primary" size="md" fullWidth icon="user" disabled={busy} onClick={createUser}>Create User Account</Button>
        </div>
      </Modal>
    </AdminLayout>
  );
};

// ─── STAFF MANAGEMENT ────────────────────────────────────────────────────────
const StaffManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [search, setSearch] = React.useState('');
  const [filter, setFilter] = React.useState('all');
  const [staff, setStaff] = React.useState([]);
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/staff', { headers: { Authorization: `Bearer ${session.token}` } }).then(r => r.json()).then(rows => Array.isArray(rows) && setStaff(rows.map(s => ({ id: s.employee_code, name: `${s.first_name} ${s.last_name}`, department: s.department || 'General', status: s.user_status || 'active', weeklyHours: Number(s.weekly_hours || 0), hourlyRate: Number(s.hourly_rate_inr || 0) })))).catch(() => {});
  }, [session?.token]);

  const filtered = staff.filter(s => {
    if (filter !== 'all' && s.status !== filter) return false;
    const q = search.toLowerCase();
    if (q && !s.name.toLowerCase().includes(q) && !s.id.toLowerCase().includes(q) && !s.department.toLowerCase().includes(q)) return false;
    return true;
  });

  const totalHours = staff.reduce((sum, s) => sum + s.weeklyHours, 0);
  const weeklyPayroll = staff.reduce((sum, s) => sum + (s.weeklyHours * s.hourlyRate), 0);
  const activeStaff = staff.filter(s => s.status === 'active').length;

  return (
    <AdminLayout page="staffmgmt" setPage={setPage} title="Staff Management" subtitle="Manage staff clock-in/out times, weekly hours and payroll details">
      <div style={{ padding: '24px 28px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Total Staff" value={staff.length.toString()} sub="Registered employees" icon="users" />
          <StatCard label="Active Staff" value={activeStaff.toString()} sub="Currently working" icon="check" color={DS.c.success} />
          <StatCard label="Weekly Hours" value={totalHours.toString()} sub="Total scheduled hours" icon="clock" color={DS.c.info} />
          <StatCard label="Weekly Payroll" value={`A$${weeklyPayroll.toLocaleString()}`} sub="Hours × hourly rate" icon="payment" color={DS.c.gold} bg={DS.c.navy} />
        </div>

        <div className="ga-card" style={{ padding: '16px 20px', marginBottom: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {['all', 'active', 'onleave'].map(f => (
              <button key={f} className={`ga-tab ${filter === f ? 'active' : ''}`} style={{ fontSize: 12, padding: '6px 14px' }} onClick={() => setFilter(f)}>
                {f === 'all' ? 'All' : f === 'onleave' ? 'On Leave' : 'Active'}
              </button>

              <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)', color: DS.c.textMuted }}><Icon name="search" size={14} /></span>

        <div className="ga-card" style={{ overflow: 'hidden', marginBottom: 24 }}>
          <table className="ga-table">
            <thead>
              <tr><th>Staff ID</th><th>Name</th><th>Role</th><th>Department</th><th>Clock-In</th><th>Clock-Out</th><th>Weekly Hours</th><th>Hourly Pay</th><th>Weekly Pay</th><th>Hiring Date</th><th>Status</th></tr>
            </thead>
            <tbody>
              {filtered.length === 0 ? (
                <tr><td colSpan="11" style={{ textAlign: 'center', padding: 24, color: DS.c.textMuted }}>No staff records loaded from database.</td></tr>
              ) : filtered.map(s => (
                <tr key={s.id}>
                  <td style={{ fontFamily: DS.f.serif, fontWeight: 600, color: DS.c.navy }}>{s.id}</td>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                      <div style={{ width: 28, height: 28, borderRadius: '50%', background: `${DS.c.gold}20`, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 600, color: DS.c.goldDark }}>{s.name[0]}</div>
                      <span style={{ fontWeight: 500 }}>{s.name}</span>
                    </div>
                  </td>
                  <td>{s.role}</td>
                  <td>{s.department}</td>
                  <td style={{ fontWeight: 600 }}>{s.clockIn}</td>
                  <td style={{ fontWeight: 600 }}>{s.clockOut}</td>
                  <td>{s.weeklyHours} hrs</td>
                  <td>A${s.hourlyRate}/hr</td>
                  <td style={{ fontWeight: 600, color: DS.c.gold }}>A${(s.weeklyHours * s.hourlyRate).toLocaleString()}</td>
                  <td>{s.hiringDate}</td>

                </tr>

        <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 20 }}>
          <div className="ga-card" style={{ padding: '20px' }}>
            <h3 style={{ fontFamily: DS.f.serif, fontSize: 18, marginBottom: 14 }}>Today&apos;s Shift Overview</h3>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
              {staff.length === 0 ? (
                <div style={{ gridColumn: '1 / -1', background: DS.c.beigeLight, borderRadius: DS.r.lg, padding: '18px', color: DS.c.textMuted, textAlign: 'center' }}>No shift records loaded from database.</div>
              ) : staff.slice(0, 3).map(s => (
                <div key={s.id} style={{ background: DS.c.beigeLight, borderRadius: DS.r.lg, padding: '14px', border: `1px solid ${DS.c.borderLight}` }}>
                  <div style={{ fontWeight: 600, color: DS.c.navy, marginBottom: 4 }}>{s.name}</div>
                  <div style={{ fontSize: 12, color: DS.c.textMuted, marginBottom: 10 }}>{s.department}</div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12 }}><span>In</span><strong>{s.clockIn}</strong></div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginTop: 4 }}><span>Out</span><strong>{s.clockOut}</strong></div>
                </div>
              ))}
            </div>
          </div>

          <div className="ga-card" style={{ padding: '20px' }}>
            <h3 style={{ fontFamily: DS.f.serif, fontSize: 18, marginBottom: 14 }}>Payroll Notes</h3>
            <div style={{ fontSize: 13, lineHeight: 1.8, color: DS.c.textMid }}>
              Weekly payment is calculated from each staff member&apos;s recorded weekly hours and hourly pay rate. The hiring date helps admin track employment history and staff records.
            </div>
          </div>
        </div>
      </div>
    </AdminLayout>

};

// ─── ENQUIRY PAGE (Admin) ─────────────────────────────────────────────────────
const EnquiryManagement = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [enquiries, setEnquiries] = React.useState([]);
  const [loadError, setLoadError] = React.useState('');
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/enquiries', { headers: { Authorization: `Bearer ${session.token}` } })
      .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.message || 'Unable to load enquiries.'); return d; })
      .then(setEnquiries).catch(e => setLoadError(e.message));
  }, [session?.token]);
  const resolveEnquiry = async (id) => {
    setLoadError('');
    try {
      const response = await fetch(`http://localhost:5000/api/enquiries/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.token}` }, body: JSON.stringify({ status: 'closed' }) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Could not resolve enquiry.');
      setEnquiries(items => items.map(e => e.id === id ? { ...e, enquiry_status: 'closed' } : e));
    } catch (error) { setLoadError(error.message); }
  };
  const pendingCount = enquiries.filter(e => e.enquiry_status !== 'closed').length;
  const resolvedCount = enquiries.length - pendingCount;
  return (
    <AdminLayout page="enquiry" setPage={setPage} title="Enquiry Management" subtitle="Customer messages and support requests">
      <div style={{ padding: '24px 28px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 16, marginBottom: 24 }}>
          <StatCard label="Total Enquiries" value={String(enquiries.length)} sub="Loaded from database" icon="enquiry" />
          <StatCard label="Pending Response" value={String(pendingCount)} sub="Awaiting reply" icon="bell" color={DS.c.warning} />
          <StatCard label="Resolved" value={String(resolvedCount)} sub="Resolved enquiries" icon="check" color={DS.c.success} />
        </div>
        <div className="ga-card" style={{ overflow: 'hidden' }}>
          <div style={{ padding: '14px 18px', borderBottom: `1px solid ${DS.c.border}` }}>
            <h3 style={{ fontFamily: DS.f.serif, fontSize: 18 }}>All Enquiries</h3>
          </div>
          <table className="ga-table">
            <thead><tr><th>ID</th><th>From</th><th>Subject</th><th>Type</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              {loadError ? <tr><td colSpan="7" style={{ textAlign: 'center', padding: 24, color: DS.c.warning }}>{loadError}</td></tr> : enquiries.length === 0 ? (
                <tr><td colSpan="7" style={{ textAlign: 'center', padding: 24, color: DS.c.textMuted }}>No enquiry records loaded from database.</td></tr>
              ) : enquiries.map(e => (
                <tr key={e.id}>
                  <td style={{ fontFamily: DS.f.serif, fontWeight: 600, color: DS.c.gold, fontSize: 12 }}>{e.id}</td>
                  <td style={{ fontWeight: 500 }}>{e.name}</td>
                  <td>{e.subject || 'General enquiry'}</td>
                  <td><span style={{ fontSize: 11, background: DS.c.beigeLight, color: DS.c.textMid, padding: '2px 8px', borderRadius: DS.r.full, textTransform: 'capitalize' }}>{e.subject || 'general'}</span></td>
                  <td style={{ fontSize: 13, color: DS.c.textMuted }}>{e.created_at ? new Date(e.created_at).toLocaleDateString() : ''}</td>
                  <td><Badge status={e.enquiry_status === 'closed' ? 'confirmed' : 'pending'} text={e.enquiry_status === 'closed' ? 'Resolved' : 'Pending'} /></td>
                  <td>
                    <div style={{ display: 'flex', gap: 6 }}>
                      <Button variant="primary" size="xs">Reply</Button>
                      <Button variant="ghost" size="xs" icon="check" onClick={() => resolveEnquiry(e.id)}>Resolve</Button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </AdminLayout>
  );
};



// ─── STAFF DOCUMENT VERIFICATION ─────────────────────────────────────────────
const StaffVerification = ({ setPage }) => {
  const session = React.useContext(AuthContext);
  const [pendingRecords, setPendingRecords] = React.useState([]);
  const [documentType, setDocumentType] = React.useState('');
  const [documentName, setDocumentName] = React.useState('');
  const [checks, setChecks] = React.useState({ name: false, valid: false, booking: false });
  const [status, setStatus] = React.useState('Pending Verification');
  const [message, setMessage] = React.useState('Staff must verify the guest document before confirming check-in.');
  const [messageType, setMessageType] = React.useState('note');
  React.useEffect(() => {
    if (!session?.token) return;
    fetch('http://localhost:5000/api/verifications/pending', { headers: { Authorization: `Bearer ${session.token}` } })
      .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.message); return d; }).then(setPendingRecords).catch(e => { setMessageType('error'); setMessage(e.message); });
  }, [session?.token]);

  const [selectedId, setSelectedId] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const live = pendingRecords.find(r => String(r.verification_id) === selectedId) || pendingRecords[0] || {};
  React.useEffect(() => {
    setChecks({ name: false, valid: false, booking: false });
    setStatus(live.verification_status === 'verified' ? 'Verified' : 'Pending Verification');
  }, [live.verification_id]);
  const booking = {
    bookingId: live.booking_ref || '', guestName: live.guest_name || '', roomType: live.room_type || '',
    roomNumber: live.room_number || '', guestCount: live.total_guests || 0,
    checkIn: String(live.check_in_date || '').slice(0,10), checkOut: String(live.check_out_date || '').slice(0,10),
    documentType: live.document_type || '', documentName: live.file_path || 'No file uploaded'
  };
  const act = async (action) => {
    if (!live.verification_id || busy) return;
    if (action === 'verified' && (!checks.name || !checks.valid || !checks.booking)) {
      setMessageType('error'); setMessage('Complete every checklist item first.'); return;
    }
    setBusy(true);
    try {
      const response = await fetch(`http://localhost:5000/api/verifications/${live.verification_id}/action`, { method:'PATCH', headers:{'Content-Type':'application/json', Authorization:`Bearer ${session.token}`}, body:JSON.stringify({action}) });
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || 'Action failed.');
      setStatus(action === 'verified' ? 'Verified' : action === 'rejected' ? 'Verification Rejected' : 'Checked In');
      setMessageType('success'); setMessage(data.message);
      if (action !== 'verified') setPendingRecords(rows => rows.filter(r => r.verification_id !== live.verification_id));
    } catch (error) { setMessageType('error'); setMessage(error.message); }
    finally { setBusy(false); }
  };
  const verifyDocument = () => act('verified');
  const rejectVerification = () => act('rejected');
  const confirmCheckIn = () => act('confirmed_check_in');
  const viewDocument = async () => {
    try {
      const response = await fetch(`http://localhost:5000/api/verifications/documents/${live.document_id}`, {headers:{Authorization:`Bearer ${session.token}`}});
      if (!response.ok) throw new Error('Document could not be downloaded.');
      const url = URL.createObjectURL(await response.blob());
      const link = document.createElement('a'); link.href = url; link.download = live.file_path; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (error) { setMessageType('error'); setMessage(error.message); }
  };

  const messageStyle = messageType === 'success'
    ? { background: '#E9F8F1', borderLeft: `4px solid ${DS.c.success}`, color: '#0B7A4B' }
    : messageType === 'error'
      ? { background: '#FDECEC', borderLeft: `4px solid ${DS.c.danger}`, color: '#B42318' }
      : { background: '#FFF7E6', borderLeft: `4px solid ${DS.c.gold}`, color: '#8A5A12' };

  return (
    <AdminLayout page="staffverify" setPage={setPage} title="Staff Document Verification" subtitle="Verify guest identity before confirming check-in">
      <div style={{ padding: 28 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 24 }}>
          <div className="ga-card" style={{ padding: 26, background: DS.c.navy, color: DS.c.white }}>
            <h2 style={{ fontFamily: DS.f.serif, fontSize: 24, color: DS.c.gold, marginBottom: 22 }}>Booking Summary</h2>
            {[
              ['Booking ID', booking.bookingId],
              ['Guest Name', booking.guestName],
              ['Room Type', booking.roomType],
              ['Room Number', booking.roomNumber],
              ['Guest Count', booking.guestCount],
              ['Check-in Date', booking.checkIn],
              ['Check-out Date', booking.checkOut],
              ['Document Type', booking.documentType],
              ['Document File', booking.documentName],
            ].map(([label, value]) => (
              <div key={label} style={{ display: 'flex', justifyContent: 'space-between', gap: 20, padding: '10px 0', borderBottom: '1px solid rgba(255,255,255,0.08)', fontSize: 14 }}>
                <span style={{ color: 'rgba(255,255,255,0.55)' }}>{label}</span>
                <strong style={{ textAlign: 'right', color: DS.c.white }}>{value}</strong>
              </div>
            ))}
            <div style={{ display: 'inline-block', marginTop: 20, padding: '10px 14px', borderRadius: DS.r.full, fontSize: 12, fontWeight: 700, background: status === 'Verified' ? '#DCFCE7' : status.includes('Rejected') ? '#FEE2E2' : '#FFF7E6', color: status === 'Verified' ? '#15803D' : status.includes('Rejected') ? '#DC2626' : '#9B6200' }}>
              {status}
            </div>
            <div style={{ ...messageStyle, marginTop: 18, padding: 14, borderRadius: DS.r.md, fontSize: 13, lineHeight: 1.6 }}>
              {message}
            </div>
          </div>

          <div className="ga-card" style={{ padding: 26 }}>
            <h2 style={{ fontFamily: DS.f.serif, fontSize: 24, color: DS.c.navy, marginBottom: 18 }}>Document Verification</h2>
            <div style={{ border: `2px dashed ${DS.c.border}`, borderRadius: DS.r.lg, padding: 24, textAlign: 'center', background: DS.c.beigeLight, marginBottom: 18 }}>
              <div style={{ fontSize: 28, marginBottom: 8 }}>📄</div>
              <p style={{ color: DS.c.textMuted, marginBottom: 12 }}>Select a booking and download its submitted document for review.</p>
              <select className="ga-input" value={live.verification_id || ''} onChange={e => setSelectedId(e.target.value)}>
                {!pendingRecords.length && <option value="">No pending verifications</option>}
                {pendingRecords.map(r => <option key={r.verification_id} value={r.verification_id}>{r.booking_ref} — {r.guest_name}</option>)}
              </select>
              <Button variant="outline" size="sm" disabled={!live.document_id || busy} onClick={viewDocument}>Download Document</Button>
            </div>
            <label style={{ fontSize: 13, fontWeight: 600 }}>Document Type: {booking.documentType || 'None'}</label>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginTop: 8 }}>
              {[
                ['name', 'Guest name matches the document'],
                ['valid', 'Document is valid and not expired'],
                ['booking', 'Booking details match guest information'],
              ].map(([key, label]) => (
                <label key={key} style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 14, color: DS.c.textMid }}>
                  <input type="checkbox" checked={checks[key]} onChange={e => setChecks({ ...checks, [key]: e.target.checked })} style={{ accentColor: DS.c.gold }} />
                  {label}
                </label>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginTop: 24 }}>
              <Button variant="danger" size="sm" onClick={rejectVerification}>Reject</Button>
              <Button variant="primary" size="sm" onClick={verifyDocument}>Verify Document</Button>
              <Button variant="outline" size="sm" onClick={confirmCheckIn}>Confirm Check-in</Button>
            </div>
          </div>
        </div>
      </div>
    </AdminLayout>
  );
};
